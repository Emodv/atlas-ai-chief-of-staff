[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas V2 digital twin API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
